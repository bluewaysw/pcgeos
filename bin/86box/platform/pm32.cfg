# 86Box layer for TARGET_PLATFORM=pm32 (protected mode, 32 bit) -- default
#
# ASUS P/I-P55TP4XE (Intel 430FX, Award BIOS), Pentium 100, 32 MB,
# S3 Trio64 PCI (VESA BIOS), PS/2 mouse.
# ROMs: roms/machines/p54tp4xe/t15i0302.awd, roms/video/s3/86c764x1.bin

[Machine]
machine = p54tp4xe
cpu_family = pentium_p54c
cpu_speed = 100000000
cpu_multi = 1.5
mem_size = 32768
cpu_use_dynarec = 1
fpu_type = internal

[Video]
gfxcard = s3_trio64_pci

[S3 Trio64 PCI]
memory = 2

[Input devices]
mouse_type = ps2

[img86box]
roms = machines/p54tp4xe/t15i0302.awd video/s3/86c764x1.bin
ptty = 1,115200
xms = HIMEMX.EXE
mouse = /P
