# 86Box layer for TARGET_PLATFORM=pm16 (protected mode, 16 bit (fan edition))
#
# Hyundai Solomon 286KP (SCAT chipset, Award BIOS, on-board IDE), 286 at
# 12.5 MHz, 8 MB, Cirrus Logic GD5428 ISA (VESA BIOS), Microsoft
# serial mouse on COM2 (COM1 carries the Swat stub).
# ROMs: roms/machines/award286/award.bin, roms/video/cirruslogic/5428.bin
#
# The Award 286 BIOS has no IDE auto detection: on the first start enter
# BIOS setup (Del) and set drive C: to the user type with 16 heads,
# 63 sectors and the cylinder count printed by "target" (or shown in
# 86Box's hard disk settings). 86Box keeps the setting in the VM directory.
#
# The FreeDOS kernel and boot code must run on a 286: use the 8086 kernel
# (downloaded by default) and a FreeDOS image with a FAT16 partition.
# HIMEMX needs a 386, so no XMS driver is loaded.

[Machine]
machine = award286
cpu_family = 286
cpu_speed = 12500000
cpu_multi = 1
mem_size = 8192
fpu_type = none

[Video]
gfxcard = cl_gd5428_isa

[Cirrus Logic GD5428 (ISA)]
memory = 2048

[Input devices]
mouse_type = msserial

[Microsoft Serial Mouse]
port = 1

[img86box]
roms = machines/award286/award.bin video/cirruslogic/5428.bin
ptty = 1,57600
xms =
mouse = /S2
