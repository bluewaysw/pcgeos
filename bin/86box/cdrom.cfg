# 86Box layer, used when GEOS_CDROM_DRIVE names an ISO image: ATAPI CD-ROM
# as slave on the first IDE channel. In DOS it is drive R: (img86box loads
# the FreeDOS CD-ROM drivers if they are available).

[Floppy and CD-ROM drives]
cdrom_01_parameters = 1, atapi
cdrom_01_ide_channel = 0:1
cdrom_01_image_path = @CDROM@

[img86box]
cdrom = 1
