# 86Box machine configuration for PC/GEOS targets -- common layer
#
# bin/box86.pl merges these layers into $LOCAL_ROOT/86box/<platform>.<ec|nec>/
# 86box.cfg before every start:
#
#   1. bin/86box/base.cfg                  (this file)
#   2. bin/86box/platform/$TARGET_PLATFORM.cfg   (rm16, pm16, pm32)
#   3. bin/86box/serial-linux.cfg or serial-win32.cfg
#   4. bin/86box/cdrom.cfg                 (only if GEOS_CDROM_DRIVE is an ISO)
#   5. $LOCAL_ROOT/86box_user.cfg          (optional, all platforms)
#   6. $LOCAL_ROOT/86box_user.$TARGET_PLATFORM.cfg  (optional)
#
# Later layers override single keys of earlier ones. The [img86box] section
# is not written to 86box.cfg; it holds the settings for the disk image
# (see Tools/img86box). Keys named "ini" are collected from all layers.
#
# Placeholders: @IMAGE@ disk image, @CYLS@ its cylinders, @PIPE@ named pipe
# (Windows), @PORT@ TCP port (Linux), @CDROM@ ISO image, @EC@ "ec" for EC
# builds, empty otherwise.

[General]
confirm_exit = 0
confirm_reset = 0
confirm_save = 0

[Machine]
time_sync = local

[Hard disks]
hdd_01_parameters = 63, 16, @CYLS@, 0, ide
hdd_01_fn = @IMAGE@
hdd_01_ide_channel = 0:0

[img86box]
# Swat serial stub, relative to ROOT_DIR (built by "pmake" in Installed)
stub = Installed/Tools/swat/Stub/LowMem/swat.exe
# size of a newly created image in MB (max. 504)
size_mb = 256
# start command and directory inside the image
workdir = ENSEMBLE
run = CALL SS.BAT
# FreeDOS kernel file (from FREEDOS_SYSDIR, the downloaded 8086 kernel or
# the FreeDOS image)
kernel = KERNEL.SYS
# The target's NET.INI mouse ("Basebox Mouse", ctmabs) works on top of any
# INT 33h driver, so under 86Box it only needs CuteMouse loaded in DOS (see
# "mouse" in the platform layers). GEOS ini settings can still be changed
# for 86Box only, one "ini = section:key=value" line per setting, e.g.
#   ini = mouse:device=CuteMouse Wheel Mouse
#   ini = mouse:driver=ctm@EC@.geo
