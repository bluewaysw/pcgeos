# 86Box layer (Linux/macOS hosts): COM1 is a pseudo terminal; 86Box starts
# socat to forward it to a local TCP port that swat connects to
# (SWAT_SERIAL_TCP). socat must be installed.

[Ports (COM & LPT)]
serial1_enabled = 1
serial1_device = stdio

[Virtual Console (COM) #1]
mode = 3
command = exec socat -d0 "$PTY",raw,echo=0 TCP-LISTEN:@PORT@,bind=127.0.0.1,reuseaddr,fork
command_terminal = 0
