<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180"
     viewBox="-50 -25 200 100" preserveAspectRatio="xMidYMid meet">
  <!-- Non-zero viewBox origin and aspect-ratio-preserving viewport mapping. -->
  <rect x="-50" y="-25" width="200" height="100"
        fill="#f0f0f0" stroke="#202020" stroke-width="2"/>
  <line x1="-50" y1="25" x2="150" y2="25" stroke="#cc0000" stroke-width="2"/>
  <line x1="50" y1="-25" x2="50" y2="75" stroke="#0040cc" stroke-width="2"/>
  <circle cx="50" cy="25" r="22" fill="#ffe080" stroke="#604000" stroke-width="2"/>
  <polygon points="-35,60 -10,35 15,60" fill="#80d080" stroke="#205020" stroke-width="2"/>
  <polygon points="85,60 110,35 135,60" fill="#d080d0" stroke="#602060" stroke-width="2"/>
</svg>
