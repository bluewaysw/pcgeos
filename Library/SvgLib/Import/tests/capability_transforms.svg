<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220">
  <!-- Group translation and inherited paint. -->
  <g transform="translate(20,20)" fill="#80d080" stroke="#205020" stroke-width="3">
    <rect x="0" y="0" width="55" height="35"/>
    <circle cx="90" cy="18" r="18"/>
  </g>

  <!-- Element scale; stroke width scales from the cached world matrix. -->
  <rect x="10" y="45" width="45" height="28" transform="translate(20,35) scale(1.6)"
        fill="#80b0ff" stroke="#203080" stroke-width="2"/>

  <polygon points="0,-28 25,20 -25,20" transform="translate(245,55) rotate(25)"
           fill="#ffb060" stroke="#804000" stroke-width="3"/>

  <ellipse cx="0" cy="0" rx="42" ry="20" transform="translate(90,165) skewX(25)"
           fill="#e0a0e0" stroke="#703070" stroke-width="3"/>

  <rect x="-30" y="-18" width="60" height="36"
        transform="matrix(0.9,-0.35,0.35,0.9,260,165)"
        fill="#ffff90" stroke="#706000" stroke-width="3"/>
</svg>
