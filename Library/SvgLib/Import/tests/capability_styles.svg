<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220"
     color="#204080">
  <!-- Group inheritance and element overrides. -->
  <g fill="#a0d8ff" stroke="currentColor" stroke-width="4">
    <rect x="15" y="15" width="80" height="50"/>
    <circle cx="140" cy="40" r="26" fill="#ffe080"/>
    <ellipse cx="225" cy="40" rx="45" ry="25" stroke="#a02020"/>
  </g>

  <!-- Inline style properties and named/rgb colors. -->
  <rect x="290" y="15" width="55" height="50"
        style="fill:rgb(160,255,160);stroke:navy;stroke-width:3"/>

  <!-- Line caps. -->
  <line x1="25" y1="100" x2="105" y2="100" stroke="#202020" stroke-width="12" stroke-linecap="butt"/>
  <line x1="140" y1="100" x2="220" y2="100" stroke="#2060b0" stroke-width="12" stroke-linecap="round"/>
  <line x1="255" y1="100" x2="335" y2="100" stroke="#a04020" stroke-width="12" stroke-linecap="square"/>

  <!-- Line joins and miter limit. -->
  <polyline points="25,190 65,135 105,190" fill="none" stroke="#202020"
            stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="2"/>
  <polyline points="140,190 180,135 220,190" fill="none" stroke="#2060b0"
            stroke-width="10" stroke-linejoin="round"/>
  <polyline points="255,190 295,135 335,190" fill="none" stroke="#a04020"
            stroke-width="10" stroke-linejoin="bevel"/>
</svg>
