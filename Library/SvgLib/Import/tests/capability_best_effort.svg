<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180">
  <title>This title and all other non-rendering content are skipped.</title>
  <defs>
    <path d="M0 0 L360 180" stroke="#ff0000" stroke-width="12"/>
  </defs>

  <!-- Unsupported visible content is skipped; supported siblings remain. -->
  <text x="10" y="20">Text is intentionally unsupported in v1.</text>
  <image x="0" y="0" width="20" height="20" href="missing.png"/>

  <rect x="15" y="25" width="75" height="45" fill="#80c0ff" stroke="#204060" stroke-width="3"/>

  <!-- display:none suppresses a complete container subtree. -->
  <g display="none">
    <circle cx="140" cy="48" r="28" fill="#ff0000"/>
    <rect x="180" y="20" width="60" height="55" fill="#ff0000"/>
  </g>

  <!-- visibility is inherited, but a descendant may override it. -->
  <g visibility="hidden" fill="#d080d0" stroke="#602060" stroke-width="3">
    <rect x="15" y="105" width="75" height="45"/>
    <circle cx="145" cy="128" r="25" visibility="visible"/>
  </g>

  <!-- Unknown containers are transparent to supported descendants. -->
  <a>
    <polygon points="235,150 275,95 315,150" fill="#ffe080" stroke="#806000" stroke-width="3"/>
  </a>
</svg>
