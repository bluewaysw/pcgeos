<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head><title>SRCSET parsing test</title></head>
<body>
<p>Smallest width should select green.gif:
<img src="red.gif" srcset="blue.gif 640w, green.gif 320w"></p>
<p>Smallest density should select green.gif:
<img src="red.gif" srcset="blue.gif 2x, green.gif .75x"></p>
<p>A width candidate takes priority and should select blue.gif:
<img src="red.gif" srcset="green.gif .5x, blue.gif 640w"></p>
<p>Malformed descriptors should fall back to red.gif:
<img src="red.gif" srcset="none.gif 0w, none.gif 1.x"></p>
</body>
</html>
